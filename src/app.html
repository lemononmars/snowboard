<!doctype html>
<html lang="en" data-theme="winter">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<meta name="theme-color" content="#333333">

	<link rel="manifest" href="%sveltekit.assets%/manifest.json" crossorigin="use-credentials">
	<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png">
	
	<!-- Material Icons and Google Fonts (Outfit & Inter) -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

	%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover" class="bg-base-200 min-h-screen text-base-content antialiased">
	<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
